name: conda-bld

on:
  push:
  pull_request:

  workflow_dispatch:
    inputs:
      py_version:
        description: Python version to build
        default: "3.13"
        type: string

env:
  PY_VERSION: ${{ inputs.py_version || '3.13' }}

jobs:
  conda_build:
    runs-on: ubuntu-latest

    container:
      image: mambaorg/micromamba:2.5.0-alpine3.21
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build conda package
        shell: bash
        run: |
          eval "$(micromamba shell hook --shell bash)"
          micromamba install -y -c conda-forge \
            boa \
            conda-forge-pinning \
            conda-verify \
            pyyaml

          INTERNAL_PREFIX=$(conda info --base)
          PINNING="$INTERNAL_PREFIX/conda_build_config.yaml"

          python3 - "$PINNING" <<'PYEOF'
          import sys, yaml
          
          path = sys.argv[1]
          with open(path) as f:
              cfg = yaml.safe_load(f)
          
          zip_group = next(g for g in cfg["zip_keys"] if "python" in g)
          for key in zip_group:
              cfg[key] = [cfg[key][-1]]
          
          with open(path, "w") as f:
              yaml.dump(cfg, f, default_flow_style=False)
          PYEOF

          conda mambabuild project/conda_recipe/ \
            -c conda-forge \
            --variant-config-files "$PINNING"
