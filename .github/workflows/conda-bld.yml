name: conda-bld

on:
  push:
  pull_request:

  workflow_dispatch:
    inputs:
      py_version:
        description: Python version to build
        default: "3.13"
        type: string

env:
  PY_VERSION: ${{ inputs.py_version || '3.13' }}

jobs:
  conda_build:
    runs-on: ubuntu-latest

    container:
      image: mambaorg/micromamba:2.5.0-alpine3.21
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build conda package
        shell: bash
        run: |
          eval "$(micromamba shell hook --shell bash)"
          micromamba install -y -c conda-forge \
            boa \
            conda-forge-pinning \
            conda-verify \
            yq

          INTERNAL_PREFIX=$(conda info --base)
          PINNING="$INTERNAL_PREFIX/conda_build_config.yaml"

          # Take just the last (=latest) entry of each key zipped with python
          yq eval '
            .zip_keys[] | select(contains(["python"]))
          ' "$PINNING" -o json | jq -r '.[]' | while read -r key; do
            yq eval ".${key} = [.${key}[-1]]" -i "$PINNING"
          done

          conda mambabuild project/conda_recipe/ \
            -c conda-forge \
            --variant-config-files "$PINNING"
